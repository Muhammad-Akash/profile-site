<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Card art generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 800px; height: 800px; overflow: hidden;
    background: transparent;
    -webkit-font-smoothing: antialiased;
  }

  .art {
    position: relative;
    width: 800px; height: 800px;
    overflow: hidden;
    display: none;
    background: transparent;
  }
  .art.on { display: block; }

  /* soft radial bloom behind the device */
  .art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(460px 460px at 50% 38%,
      color-mix(in srgb, var(--tint) 30%, transparent), transparent 70%);
    opacity: .85;
  }


  .phone {
    position: absolute;
    width: 430px;
    height: 965px;
    left: 185px;
    top: 108px;
    border-radius: 46px;
    overflow: hidden;
    z-index: 3;
    background: #000;
    box-shadow:
      0 0 0 11px #1d1c1a,
      0 0 0 12px rgba(255, 255, 255, .16),
      0 34px 58px -18px rgba(28, 27, 24, .42),
      0 12px 24px -8px rgba(28, 27, 24, .26);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>

<section class="art" id="family-safe"
         style="--tint:#2f6bff;">
  <div class="phone"><img src="../img/family-safe/01-dashboard.webp" alt="" /></div>
</section>

<section class="art" id="bloomly"
         style="--tint:#5f8a4e;">
  <div class="phone"><img src="../img/bloomly/01-home.webp" alt="" /></div>
</section>

<section class="art dark" id="itn-vpn"
         style="--tint:#47e6a1;">
  <div class="phone"><img src="../img/itn-vpn/02-connected.webp" alt="" /></div>
</section>

<section class="art" id="meherpur-sheba"
         style="--tint:#1f7a4d;">
  <div class="phone"><img src="../img/meherpur-sheba/01-home.webp" alt="" /></div>
</section>

<script>
  const want = new URLSearchParams(location.search).get('p');
  const el = document.getElementById(want) || document.querySelector('.art');
  if (el) el.classList.add('on');
</script>
</body>
</html>
