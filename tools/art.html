<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Art generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&family=Lato:wght@400;700&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { overflow: hidden; background: transparent; }
  body.cover { width: 1600px; height: 650px; background: #f6f5f1; }
  body.card  { width: 800px;  height: 800px; }

  /* ============ COVER ============ */
  .cover-wrap {
    position: relative;
    width: 1600px; height: 650px;
    overflow: hidden;
    background:
      radial-gradient(900px 620px at 86% 42%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 68%),
      #f6f5f1;
  }
  .cover-wrap::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(53,53,52,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(53,53,52,.045) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(to right, black, transparent 62%);
    mask-image: linear-gradient(to right, black, transparent 62%);
  }
  .cover-wrap.dark {
    background:
      radial-gradient(760px 560px at 84% 46%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%),
      #0d1420;
  }
  .cover-wrap.dark::before { display: none; }

  .copy {
    position: absolute; left: 84px; top: 0;
    height: 650px; width: 820px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 22px; z-index: 2;
  }
  .kicker {
    font-family: 'Lato', system-ui, sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink);
    display: flex; align-items: center; gap: 14px;
  }
  .kicker::before { content: ""; width: 34px; height: 2px; background: var(--ink); opacity: .55; }
  .copy h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600; font-size: 96px; line-height: .96;
    letter-spacing: -.022em; color: #353534;
  }
  .copy p.sub {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 27px; line-height: 1.42; color: #56534f; max-width: 690px;
  }
  .meta {
    font-family: 'Lato', system-ui, sans-serif;
    font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
    color: #55524e; display: flex; gap: 10px; align-items: center; margin-top: 6px;
  }
  .meta span { padding: 7px 13px; border: 1px solid rgba(53,53,52,.26); border-radius: 100px; }

  .cover-wrap.dark .copy h1 { color: #eef2f8; }
  .cover-wrap.dark .copy p.sub { color: #aab5c5; }
  .cover-wrap.dark .meta { color: #a3aebf; }
  .cover-wrap.dark .meta span { border-color: rgba(238,242,248,.3); }

  .device {
    position: absolute; right: 96px; top: 78px;
    width: 246px; height: 552px;
    border-radius: 30px; overflow: hidden; z-index: 3;
    background: #000;
    box-shadow:
      0 0 0 7px #1d1c1a,
      0 0 0 8px rgba(255,255,255,.14),
      0 34px 60px -18px rgba(28,27,24,.42),
      0 12px 24px -8px rgba(28,27,24,.28);
  }
  .device img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

  .device.back {
    right: 330px; top: 150px;
    width: 200px; height: 450px;
    opacity: .96; z-index: 1;
    box-shadow:
      0 0 0 6px #1d1c1a,
      0 24px 44px -16px rgba(28,27,24,.34);
  }

  /* ============ CARD ============ */
  .card-wrap {
    position: relative;
    width: 800px; height: 800px;
    overflow: hidden;
    background: transparent;
  }
  .card-wrap::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(460px 460px at 50% 38%,
      color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%);
    opacity: .85;
  }
  .card-wrap .phone {
    position: absolute;
    width: 430px; height: 965px;
    left: 185px; top: 108px;
    border-radius: 46px; overflow: hidden; z-index: 3;
    background: #000;
    box-shadow:
      0 0 0 11px #1d1c1a,
      0 0 0 12px rgba(255,255,255,.16),
      0 34px 58px -18px rgba(28,27,24,.42),
      0 12px 24px -8px rgba(28,27,24,.26);
  }
  .card-wrap .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const DATA = [
  { slug: 'family-safe', accent: '#2f6bff', ink: '#2f6bff', dark: false,
    kicker: 'Android · Parent + child', title: 'Family<br>Safety',
    sub: 'Live location, screen time and app limits across two phones, paired by QR.',
    meta: ['Kotlin', 'OpenStreetMap', 'In development'],
    front: 'img/family-safe/01-dashboard.webp', back: 'img/family-safe/05-app-management.webp',
    card: 'img/family-safe/01-dashboard.webp' },

  { slug: 'bloomly', accent: '#5f8a4e', ink: '#4a7a3a', dark: false,
    kicker: 'Android · Parenting companion', title: 'Bloomly',
    sub: 'A stage-aware guide for preparing, expecting and newborn — with answers that cite what they used.',
    meta: ['Kotlin', 'Compose', 'In development'],
    front: 'img/bloomly/01-home.webp', back: 'img/bloomly/02-ask.webp',
    card: 'img/bloomly/01-home.webp' },

  { slug: 'itn-vpn', accent: '#47e6a1', ink: '#47e6a1', dark: true,
    kicker: 'Android · VPN client', title: 'ITN VPN',
    sub: 'One tap to a private tunnel. Pick a server, watch the state, see what moved.',
    meta: ['Kotlin', 'VpnService', 'Shipped'],
    front: 'img/itn-vpn/01-disconnected.webp', back: 'img/itn-vpn/02-connected.webp',
    card: 'img/itn-vpn/02-connected.webp' },

  { slug: 'meherpur-sheba', accent: '#1f7a4d', ink: '#1f7a4d', dark: false,
    kicker: 'Android · Client work', title: 'Meherpur<br>Sheba',
    sub: 'A district directory for Meherpur — nine sections, 78 doctors, one tap to call.',
    meta: ['Kotlin', 'Firebase', 'Client'],
    front: 'img/meherpur-sheba/01-home.webp', back: 'img/meherpur-sheba/04-category-list.webp',
    card: 'img/meherpur-sheba/01-home.webp' },

  { slug: 'tuee', accent: '#c2410c', ink: '#b23c0a', dark: false,
    kicker: 'Android · Home cooking', title: 'Tuee',
    sub: 'A private recipe book for two: 41 dishes, a meal plan, and a kitchen assistant.',
    meta: ['Kotlin', 'Android', 'In development'],
    front: 'img/tuee/01-cuisine.webp', back: 'img/tuee/02-recipes.webp',
    card: 'img/tuee/02-recipes.webp' },

  { slug: 'ai-imam', accent: '#e0b64a', ink: '#e0b64a', dark: true,
    kicker: 'Android · Islamic assistant', title: 'AI Imam',
    sub: 'Answers about faith drawn from the Qur\'an and authentic Hadith, with sources.',
    meta: ['Kotlin', 'Python', 'LLM API'],
    front: 'img/ai-imam/01-home.webp', back: null,
    card: 'img/ai-imam/01-home.webp' },

  { slug: 'my-masjid-azan', accent: '#d9a94a', ink: '#d9a94a', dark: true,
    kicker: 'Android · Prayer times', title: 'My Masjid<br>Azan',
    sub: 'Prayer times for any masjid, with a home-screen widget that resizes to any size.',
    meta: ['Kotlin', 'App Widgets', 'In development'],
    front: 'img/my-masjid-azan/01-home.webp', back: 'img/my-masjid-azan/02-qibla.webp',
    card: 'img/my-masjid-azan/01-home.webp' },

  { slug: 'no-ads-qibla-compass', accent: '#d9a94a', ink: '#d9a94a', dark: true,
    kicker: 'Android · Play Store', title: 'Qibla<br>Compass',
    sub: 'Qibla direction from GPS and sensors. No ads, no account, no network.',
    meta: ['Kotlin', 'Sensors', 'Shipped'],
    front: 'img/no-ads-qibla-compass/04-live.webp', back: null,
    card: 'img/no-ads-qibla-compass/04-live.webp' },

  { slug: 'pc-controller', accent: '#4f8ff7', ink: '#4f8ff7', dark: true,
    kicker: 'Android · Desktop remote', title: 'PC<br>Controller',
    sub: 'The phone as keyboard, mouse and gamepad for the PC, over local Wi-Fi.',
    meta: ['Kotlin', 'TCP', 'Shipped'],
    front: 'img/pc-controller/01-home.webp', back: null,
    card: 'img/pc-controller/01-home.webp' },
];

const qs = new URLSearchParams(location.search);
const type = qs.get('type') === 'card' ? 'card' : 'cover';
const slug = qs.get('p');
const d = DATA.find(x => x.slug === slug) || DATA[0];

document.body.className = type;
document.documentElement.style.setProperty('--accent', d.accent);
document.documentElement.style.setProperty('--ink', d.ink);

const root = document.getElementById('root');

if (type === 'cover') {
  root.innerHTML = `
    <div class="cover-wrap${d.dark ? ' dark' : ''}">
      <div class="copy">
        <div class="kicker">${d.kicker}</div>
        <h1>${d.title}</h1>
        <p class="sub">${d.sub}</p>
        <div class="meta">${d.meta.map(m => `<span>${m}</span>`).join('')}</div>
      </div>
      ${d.back ? `<div class="device back"><img src="../${d.back}" alt="" /></div>` : ''}
      <div class="device"><img src="../${d.front}" alt="" /></div>
    </div>`;
} else {
  root.innerHTML = `
    <div class="card-wrap">
      <div class="phone"><img src="../${d.card}" alt="" /></div>
    </div>`;
}
</script>
</body>
</html>
