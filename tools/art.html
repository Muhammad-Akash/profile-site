<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Art generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&family=Lato:wght@400;700&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { overflow: hidden; background: transparent; }
  body.cover { width: 1600px; height: 650px; background: #f6f5f1; }
  body.card  { width: 800px;  height: 800px; }

  /* ============ COVER ============ */
  .cover-wrap {
    position: relative;
    width: 1600px; height: 650px;
    overflow: hidden;
    background:
      radial-gradient(900px 620px at 86% 42%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 68%),
      #f6f5f1;
  }
  .cover-wrap::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(53,53,52,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(53,53,52,.045) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(to right, black, transparent 62%);
    mask-image: linear-gradient(to right, black, transparent 62%);
  }
  .cover-wrap.dark {
    background:
      radial-gradient(760px 560px at 84% 46%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%),
      #0d1420;
  }
  .cover-wrap.dark::before { display: none; }

  .copy {
    position: absolute; left: 84px; top: 0;
    height: 650px; width: 840px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 22px; z-index: 2;
  }
  .kicker {
    font-family: 'Lato', system-ui, sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink);
    display: flex; align-items: center; gap: 14px;
  }
  .kicker::before { content: ""; width: 34px; height: 2px; background: var(--ink); opacity: .55; }
  .copy h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600; font-size: 96px; line-height: .96;
    letter-spacing: -.022em; color: #353534;
  }
  .copy p.sub {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 27px; line-height: 1.42; color: #56534f; max-width: 640px;
  }
  .meta {
    font-family: 'Lato', system-ui, sans-serif;
    font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
    color: #55524e; display: flex; gap: 10px; align-items: center; margin-top: 6px;
  }
  .meta span { padding: 7px 13px; border: 1px solid rgba(53,53,52,.26); border-radius: 100px; }

  .cover-wrap.dark .copy h1 { color: #eef2f8; }
  .cover-wrap.dark .copy p.sub { color: #aab5c5; }
  .cover-wrap.dark .meta { color: #a3aebf; }
  .cover-wrap.dark .meta span { border-color: rgba(238,242,248,.3); }

  /* one large hero phone — big enough for the UI to read at page scale */
  .device {
    position: absolute; right: 60px; top: 30px;
    width: 360px; height: 810px;
    border-radius: 40px; overflow: hidden; z-index: 3;
    background: #000;
    box-shadow:
      0 0 0 9px #1d1c1a,
      0 0 0 10px rgba(255,255,255,.14),
      0 40px 70px -22px rgba(28,27,24,.42),
      0 14px 28px -10px rgba(28,27,24,.28);
  }
  .device img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

  /* the second screen, tucked behind and to the left */
  .device.back {
    right: 372px; top: 138px;
    width: 258px; height: 580px;
    border-radius: 30px;
    opacity: .97; z-index: 1;
    box-shadow:
      0 0 0 8px #1d1c1a,
      0 0 0 9px rgba(255,255,255,.12),
      0 28px 50px -18px rgba(28,27,24,.4);
  }

  /* landscape window for games / software instead of a phone */
  .device.window {
    right: 92px; top: 128px;
    width: 566px; height: 392px;
    border-radius: 12px;
    background: #0d1420;
    box-shadow:
      0 0 0 1px rgba(28,27,24,.5),
      0 0 0 8px #1d1c1a,
      0 30px 56px -18px rgba(28,27,24,.45);
  }
  .device.window img { object-position: center; }

  /* wider window for dashboards that need the full width */
  .device.window.wide {
    right: 30px; top: 142px;
    width: 620px; height: 366px;
  }

  /* browser-extension popup: a narrow portrait window, not a phone */
  .device.popup {
    right: 110px; top: 24px;
    width: 344px; height: 612px;
    border-radius: 16px;
    background: #181818;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.14),
      0 34px 64px -22px rgba(0,0,0,.62),
      0 12px 26px -12px rgba(0,0,0,.45);
  }
  .device.popup img { object-position: top; }

  /* ============ CARD ============ */
  .card-wrap {
    position: relative;
    width: 800px; height: 800px;
    overflow: hidden;
    background: transparent;
  }
  .card-wrap::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(460px 460px at 50% 38%,
      color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%);
    opacity: .85;
  }
  .card-wrap .phone {
    position: absolute;
    width: 430px; height: 965px;
    left: 185px; top: 108px;
    border-radius: 46px; overflow: hidden; z-index: 3;
    background: #000;
    box-shadow:
      0 0 0 11px #1d1c1a,
      0 0 0 12px rgba(255,255,255,.16),
      0 34px 58px -18px rgba(28,27,24,.42),
      0 12px 24px -8px rgba(28,27,24,.26);
  }
  .card-wrap .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

  /* browser-extension popup, centred on the card */
  .card-wrap .popup {
    position: absolute;
    width: 410px; height: 730px;
    left: 195px; top: 70px;
    border-radius: 22px; overflow: hidden; z-index: 3;
    background: #181818;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.16),
      0 0 0 10px rgba(24,24,24,.16),
      0 34px 58px -18px rgba(28,27,24,.5),
      0 12px 24px -8px rgba(28,27,24,.3);
  }
  .card-wrap .popup img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

  /* full-bleed screenshot for games / software */
  .card-wrap .shot {
    position: absolute; inset: 0;
    z-index: 3;
    overflow: hidden;
  }
  .card-wrap .shot img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const DATA = [
  { slug: 'family-safe', accent: '#2f6bff', ink: '#2f6bff', dark: false,
    kicker: 'Android · Parent + child', title: 'Family<br>Safety',
    sub: 'Live location, screen time and app limits across two phones, paired by QR.',
    meta: ['Kotlin', 'OpenStreetMap', 'Finished'],
    front: 'img/family-safe/01-dashboard.webp', back: 'img/family-safe/03-app-management.webp',
    card: 'img/family-safe/01-dashboard.webp' },

  { slug: 'bloomly', accent: '#5f8a4e', ink: '#4a7a3a', dark: false,
    kicker: 'Android · Parenting companion', title: 'Bloomly',
    sub: 'A stage-aware guide for preparing, expecting and newborn — with answers that cite what they used.',
    meta: ['Kotlin', 'Compose', 'Finished'],
    front: 'img/bloomly/01-home.webp', back: 'img/bloomly/02-ask.webp',
    card: 'img/bloomly/01-home.webp' },

  { slug: 'itn-vpn', accent: '#47e6a1', ink: '#47e6a1', dark: true,
    kicker: 'Android · VPN client', title: 'ITN VPN',
    sub: 'One tap to a private tunnel. Pick a server, watch the state, see what moved.',
    meta: ['Kotlin', 'VpnService', 'Finished'],
    front: 'img/itn-vpn/01-disconnected.webp', back: 'img/itn-vpn/02-connected.webp',
    card: 'img/itn-vpn/02-connected.webp' },

  { slug: 'meherpur-sheba', accent: '#1f7a4d', ink: '#1f7a4d', dark: false,
    kicker: 'Android · Client work', title: 'Meherpur<br>Sheba',
    sub: 'A district directory for Meherpur — nine sections, 78 doctors, one tap to call.',
    meta: ['Kotlin', 'Firebase', 'Client'],
    front: 'img/meherpur-sheba/01-home.webp', back: 'img/meherpur-sheba/03-doctors.webp',
    card: 'img/meherpur-sheba/01-home.webp' },

  { slug: 'tuee', accent: '#c2410c', ink: '#b23c0a', dark: false,
    kicker: 'Android · Home cooking', title: 'Tuee',
    sub: 'A private recipe book for two: 41 dishes, a meal plan, and a kitchen assistant.',
    meta: ['Kotlin', 'Android', 'Finished'],
    front: 'img/tuee/01-recipes.webp', back: 'img/tuee/02-recipes-list.webp',
    card: 'img/tuee/01-recipes.webp' },

  { slug: 'ai-imam', accent: '#e0b64a', ink: '#e0b64a', dark: true,
    kicker: 'Android · Islamic assistant', title: 'AI Imam',
    sub: 'Answers about faith drawn from the Qur\'an and authentic Hadith, with sources.',
    meta: ['Kotlin', 'Python', 'LLM API'],
    front: 'img/ai-imam/01-home.webp',
    card: 'img/ai-imam/01-home.webp' },

  { slug: 'my-masjid-azan', accent: '#d9a94a', ink: '#d9a94a', dark: true,
    kicker: 'Android · Prayer times', title: 'My Masjid<br>Azan',
    sub: 'Prayer times for any masjid, with a home-screen widget that resizes to any size.',
    meta: ['Kotlin', 'App Widgets', 'Finished'],
    front: 'img/my-masjid-azan/01-home.webp', back: 'img/my-masjid-azan/02-qibla.webp',
    card: 'img/my-masjid-azan/01-home.webp' },

  { slug: 'no-ads-qibla-compass', accent: '#d9a94a', ink: '#d9a94a', dark: true,
    kicker: 'Android · Play Store', title: 'Qibla<br>Compass',
    sub: 'Qibla direction from GPS and sensors. No ads, no account, no network.',
    meta: ['Kotlin', 'Sensors', 'Finished'],
    front: 'img/no-ads-qibla-compass/04-live.webp',
    card: 'img/no-ads-qibla-compass/04-live.webp' },

  { slug: 'pc-controller', accent: '#4f8ff7', ink: '#4f8ff7', dark: true,
    kicker: 'Android · Desktop remote', title: 'PC<br>Controller',
    sub: 'The phone as keyboard, mouse and gamepad for the PC, over local Wi-Fi.',
    meta: ['Kotlin', 'TCP', 'Finished'],
    front: 'img/pc-controller/01-home.webp',
    card: 'img/pc-controller/01-home.webp' },

  { slug: 'neon-breaker', accent: '#b388ff', ink: '#b388ff', dark: true, frame: 'window',
    kicker: 'Browser · One level', title: 'Neon<br>Breaker',
    sub: 'Clear every neon brick. One level, three lives, no install.',
    meta: ['JavaScript', 'Canvas 2D', 'Playable'],
    front: 'img/neon-breaker/01-gameplay.webp',
    card: 'img/neon-breaker/01-gameplay.webp' },

  { slug: 'dx-ball-antigravity', accent: '#ff3d81', ink: '#ff3d81', dark: true, frame: 'window',
    kicker: 'Browser · Arcade', title: 'Neon Dx Ball',
    sub: 'A neon brick breaker where ball speed scales with every brick you break.',
    meta: ['JavaScript', 'Canvas 2D', 'Playable'],
    front: 'img/dx-ball-antigravity/01-gameplay.webp',
    card: 'img/dx-ball-antigravity/01-gameplay.webp' },

  { slug: 'flappy-bird', accent: '#4aa3b8', ink: '#2f7f92', dark: false, frame: 'window',
    kicker: 'Browser · Clone', title: 'Flappy<br>Bird',
    sub: 'The whole game in a single HTML file. Open it and play.',
    meta: ['HTML', 'Canvas 2D', 'Playable'],
    front: 'img/flappy-bird/01-gameplay.webp',
    card: 'img/flappy-bird/01-gameplay.webp' },

  { slug: 'chorus', accent: '#8b7cf6', ink: '#8b7cf6', dark: true, frame: 'window',
    kicker: 'Desktop · Distributed inference', title: 'Chorus',
    sub: 'Pools RAM and VRAM across machines on a LAN to run one large model.',
    meta: ['Tauri v2', 'Rust', 'Finished'],
    front: 'img/chorus/01-dashboard.webp',
    card: 'img/chorus/01-dashboard.webp' },

  { slug: 'wattscope', accent: '#2563eb', ink: '#1d4ed8', dark: false, frame: 'window',
    kicker: 'Desktop · Windows', title: 'WattScope',
    sub: 'Power-supply wattage calculator for PC builds, with live wall-power estimates.',
    meta: ['C#', '.NET', 'WPF'],
    front: 'img/wattscope/01-dashboard.webp',
    card: 'img/wattscope/01-dashboard.webp' },

  { slug: 'youtube-fastforward', accent: '#ff2d55', ink: '#ff2d55', dark: true, frame: 'popup',
    kicker: 'Extension · YouTube', title: 'YouTube<br>FastForward',
    sub: 'Skips sponsors, intros and outros on its own, and counts the minutes it saved.',
    meta: ['Manifest V3', 'JavaScript', 'Finished'],
    front: 'img/youtube-fastforward/01-popup.webp',
    card: 'img/youtube-fastforward/01-popup.webp' },

  { slug: 'calling-bell-app', accent: '#6c5ce7', ink: '#5b4bd6', dark: false,
    kicker: 'Android · Local network', title: 'Calling<br>Bell',
    sub: 'Two phones on one Wi-Fi: one sits by the door, the other rings.',
    meta: ['Kotlin', 'LAN', 'Finished'],
    front: 'img/calling-bell-app/01-door-bell.webp', back: 'img/calling-bell-app/02-receiver.webp',
    card: 'img/calling-bell-app/01-door-bell.webp' },
  { slug: 'portable-ai-assistant', accent: '#e0705c', ink: '#e0705c', dark: true,
    kicker: 'Android · Pocket assistant', title: 'Portable<br>AI Assistant',
    sub: 'A pocket assistant wired to a hosted LLM, with push-to-talk and a live API status line.',
    meta: ['Kotlin', 'LLM API', 'Finished'],
    front: 'img/portable-ai-assistant/01-assistant.webp',
    card: 'img/portable-ai-assistant/01-assistant.webp' },

  { slug: 'volume-control-pro', accent: '#4c8f5f', ink: '#4c8f5f', dark: true,
    kicker: 'Android · Audio control', title: 'Volume<br>Control Pro',
    sub: 'Per-app volume, a system bus and automation profiles the stock panel never had.',
    meta: ['Kotlin', 'Audio', 'Finished'],
    front: 'img/volume-control-pro/01-mixer.webp',
    card: 'img/volume-control-pro/01-mixer.webp' },

  { slug: 'loadshedding-alert', accent: '#f5a623', ink: '#f5a623', dark: true, frame: 'window', wide: true,
    kicker: 'Web · Power cuts', title: 'LoadShedding<br>Alert',
    sub: 'Warns you before the power goes, not after: schedules, pre-alerts and live grid status.',
    meta: ['FastAPI', 'Python', 'Finished'],
    front: 'img/loadshedding-alert/01-dashboard.webp',
    card: 'img/loadshedding-alert/01-dashboard.webp' },
  { slug: 'doom-scrolling', accent: '#f83830', ink: '#f83830', dark: true,
    kicker: 'Android \u00b7 Swipe counter', title: 'Doom<br>Scrolling',
    sub: 'Counts the swipes you make in the feeds you name, then puts a cap on the day.',
    meta: ['Kotlin', 'Accessibility', 'Finished'],
    front: 'img/doom-scrolling/01-home.webp', back: 'img/doom-scrolling/02-stats.webp',
    card: 'img/doom-scrolling/01-home.webp' },
  { slug: 'automated-chatbot', accent: '#22c55e', ink: '#22c55e', dark: true, frame: 'window', wide: true,
    kicker: 'AI · Support automation', title: 'Automated<br>Chatbot',
    sub: 'Answers from a flow you build, resolves most chats on its own and hands the rest to a person.',
    meta: ['Python', 'LLM API', 'Running'],
    front: 'img/automated-chatbot/01-dashboard.webp',
    card: 'img/automated-chatbot/01-dashboard.webp' },
];

const qs = new URLSearchParams(location.search);
const type = qs.get('type') === 'card' ? 'card' : 'cover';
const slug = qs.get('p');
const d = DATA.find(x => x.slug === slug) || DATA[0];

document.body.className = type;
document.documentElement.style.setProperty('--accent', d.accent);
document.documentElement.style.setProperty('--ink', d.ink);

const root = document.getElementById('root');

const isWindow = d.frame === 'window';
const isPopup = d.frame === 'popup';
const frameClass = isWindow ? (' window' + (d.wide ? ' wide' : '')) : isPopup ? ' popup' : '';

if (type === 'cover') {
  root.innerHTML = `
    <div class="cover-wrap${d.dark ? ' dark' : ''}">
      <div class="copy">
        <div class="kicker">${d.kicker}</div>
        <h1>${d.title}</h1>
        <p class="sub">${d.sub}</p>
        <div class="meta">${d.meta.map(m => `<span>${m}</span>`).join('')}</div>
      </div>
      ${d.back ? `<div class="device back"><img src="../${d.back}" alt="" /></div>` : ''}
      <div class="device${frameClass}"><img src="../${d.front}" alt="" /></div>
    </div>`;
} else if (isWindow) {
  root.innerHTML = `
    <div class="card-wrap">
      <div class="shot"><img src="../${d.card}" alt="" /></div>
    </div>`;
} else if (isPopup) {
  root.innerHTML = `
    <div class="card-wrap">
      <div class="popup"><img src="../${d.card}" alt="" /></div>
    </div>`;
} else {
  root.innerHTML = `
    <div class="card-wrap">
      <div class="phone"><img src="../${d.card}" alt="" /></div>
    </div>`;
}
</script>
</body>
</html>
